[package]
name = "guide-doctest"
description = "Compiles the code in doc/python-sdk.md and the root README as doctests."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
ebus-discovery-tokio = { path = "../../crates/ebus-discovery-tokio", version = "0.1.1", features = ["mdns-sd"] }
ebus-rumqttc = { path = "../../crates/ebus-rumqttc", version = "0.1.1" }
rumqttc = { version = "0.25", default-features = false }
tokio = { version = "1.36", default-features = false, features = ["sync", "time", "macros", "rt", "rt-multi-thread"] }

[lints]
workspace = true
