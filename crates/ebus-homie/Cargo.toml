[package]
name = "ebus-homie"
description = "Homie 5 protocol core for eBus: identifiers, topics, datatypes, descriptions and the controller and device state machines, with no I/O."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/ebus-homie"
readme = "README.md"
keywords = ["ebus", "homie", "mqtt", "iot", "no-std"]
categories = ["no-std", "no-std::no-alloc", "embedded", "network-programming"]
include = ["/src", "/README.md", "/LICENSE"]

[features]
default = ["std"]
# Links std.
std = ["alloc", "serde_json/std"]
# The controller, device and description modules and the allocating datatype API.
alloc = ["ebus-mqtt/alloc", "dep:serde_json", "dep:sha2", "dep:rpds", "dep:num-bigint", "dep:num-traits", "dep:num-integer"]
# Diagnostics through the log crate.
log = ["dep:log"]

[dependencies]
ebus-mqtt.workspace = true
log = { version = "0.4", default-features = false, optional = true }
rpds = { workspace = true, optional = true }
serde_json = { version = "1.0.100", default-features = false, features = ["alloc"], optional = true }
sha2 = { version = "0.10", default-features = false, optional = true }
num-bigint = { version = "0.4", default-features = false, optional = true }
num-traits = { version = "0.2", default-features = false, optional = true }
num-integer = { version = "0.1", default-features = false, optional = true }

[[example]]
name = "device_bench"
required-features = ["std"]

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
