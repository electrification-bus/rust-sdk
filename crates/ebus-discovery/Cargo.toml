[package]
name = "ebus-discovery"
description = "eBus DNS-SD contract: service types, TXT records, the advertisement model, merging mDNS sightings and broker selection, with no I/O."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/ebus-discovery"
readme = "README.md"
keywords = ["ebus", "mdns", "dns-sd", "discovery", "no-std"]
categories = ["no-std", "no-std::no-alloc", "embedded", "network-programming"]
include = ["/src", "/README.md", "/LICENSE"]

[features]
default = ["std"]
# Links std.
std = ["alloc"]
# TXT records, the advertisement model, instances, broker ranking and BrokerSearch.
alloc = []
# Diagnostics through the log crate.
log = ["dep:log"]

[dependencies]
ebus-mqtt.workspace = true
log = { version = "0.4", default-features = false, optional = true }

[dev-dependencies]
serde_json = "1.0.100"

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
