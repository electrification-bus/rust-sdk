[package]
name = "ebus-mqtt"
description = "MQTT vocabulary for eBus: messages and commands, topic filters and their ownership."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/ebus-mqtt"
readme = "README.md"
keywords = ["ebus", "mqtt", "homie", "iot", "no-std"]
categories = ["no-std", "no-std::no-alloc", "embedded", "network-programming"]
include = ["/src", "/README.md", "/LICENSE"]

[features]
default = ["std"]
# Links std.
std = ["alloc"]
# Command, LastWill, FilterLedger, Role and Pair.
alloc = []

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
